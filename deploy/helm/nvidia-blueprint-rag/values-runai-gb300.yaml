# RUN:AI overrides for an NVIDIA DGX GB300 cluster.
#
# This hybrid profile reuses the existing Nemotron Ultra and Super inference
# workloads in runai-nccl while retaining the six chart-managed embedding,
# reranking, and document-extraction NIMs.
#
# The extraction image versions and legacy /v1/infer + gRPC endpoints are
# intentionally pinned to the NV-Ingest 26.3 contract. The native ARM64
# application images are built from the forked NeMo-Retriever commit recorded
# by the release workflow; the proprietary NIM images still require runtime
# validation against the installed NIM Operator, driver, and GB300 platform.

nodeSelector:
  kubernetes.io/arch: arm64

imagePullSecret:
  name: dockerregistry-ngc-secret
  create: false

ngcApiSecret:
  name: genericsecret-aiq-credentials
  create: false

apiKeysSecret:
  create: false
  existingSecret: ""

service:
  type: ClusterIP
  port: 8081

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "8g"
  hosts:
    - host: nccl-rag-backend.runai.ai.nps.edu
      paths:
        - path: /
          pathType: Prefix
  tls: []

envVars:
  APP_LLM_MODELNAME: nvidia/nemotron-3-ultra-550b-a55b
  APP_LLM_SERVERURL: http://orchestrator-nemo3-ultra-550b-stone-g320.runai-nccl.svc.cluster.local/v1
  APP_QUERYREWRITER_MODELNAME: nvidia/nemotron-3-super-120b-a12b
  APP_QUERYREWRITER_SERVERURL: http://planner-nemo3-super-120b-stone-g320.runai-nccl.svc.cluster.local/v1
  APP_FILTEREXPRESSIONGENERATOR_MODELNAME: nvidia/nemotron-3-super-120b-a12b
  APP_FILTEREXPRESSIONGENERATOR_SERVERURL: http://planner-nemo3-super-120b-stone-g320.runai-nccl.svc.cluster.local/v1
  REFLECTION_LLM: nvidia/nemotron-3-super-120b-a12b
  REFLECTION_LLM_SERVERURL: http://planner-nemo3-super-120b-stone-g320.runai-nccl.svc.cluster.local/v1
  AGENTIC_PLANNER_LLM_MODEL: nvidia/nemotron-3-ultra-550b-a55b
  AGENTIC_PLANNER_LLM_SERVERURL: http://orchestrator-nemo3-ultra-550b-stone-g320.runai-nccl.svc.cluster.local/v1
  AGENTIC_TASK_LLM_MODEL: nvidia/nemotron-3-super-120b-a12b
  AGENTIC_TASK_LLM_SERVERURL: http://planner-nemo3-super-120b-stone-g320.runai-nccl.svc.cluster.local/v1
  AGENTIC_SEED_GEN_LLM_MODEL: nvidia/nemotron-3-super-120b-a12b
  AGENTIC_SEED_GEN_LLM_SERVERURL: http://planner-nemo3-super-120b-stone-g320.runai-nccl.svc.cluster.local/v1
  AGENTIC_SYNTHESIS_LLM_MODEL: nvidia/nemotron-3-ultra-550b-a55b
  AGENTIC_SYNTHESIS_LLM_SERVERURL: http://orchestrator-nemo3-ultra-550b-stone-g320.runai-nccl.svc.cluster.local/v1
  APP_VLM_MODELNAME: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
  APP_VLM_SERVERURL: http://ingest-nemo3-nano-omni-stone-g320.runai-nccl.svc.cluster.local/v1

ingestor-server:
  nodeSelector:
    kubernetes.io/arch: arm64
  imagePullSecret:
    name: dockerregistry-ngc-secret
    create: false
  envVars:
    SUMMARY_LLM: nvidia/nemotron-3-super-120b-a12b
    SUMMARY_LLM_SERVERURL: http://planner-nemo3-super-120b-stone-g320.runai-nccl.svc.cluster.local/v1
    APP_NVINGEST_CAPTIONMODELNAME: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
    APP_NVINGEST_CAPTIONENDPOINTURL: http://ingest-nemo3-nano-omni-stone-g320.runai-nccl.svc.cluster.local/v1/chat/completions
  persistence:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 50Gi
    mountPath: /data/
    subPath: ""

frontend:
  nodeSelector:
    kubernetes.io/arch: arm64
  imagePullSecret:
    name: dockerregistry-ngc-secret
    create: false
  service:
    type: ClusterIP
    port: 3000
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: "8g"
    hosts:
      - host: nccl-rag-frontend.runai.ai.nps.edu
        paths:
          - path: /
            pathType: Prefix
    tls: []

nimOperator:
  nim-llm:
    enabled: false
  nvidia-nim-llama-nemotron-embed-vl-1b-v2:
    enabled: true
    nodeSelector:
      kubernetes.io/arch: arm64
    resources:
      limits:
        nvidia.com/gpu: 1
      requests:
        nvidia.com/gpu: 1
  nvidia-nim-llama-nemotron-rerank-1b-v2:
    enabled: true
    nodeSelector:
      kubernetes.io/arch: arm64
    resources:
      limits:
        nvidia.com/gpu: 1
      requests:
        nvidia.com/gpu: 1

nv-ingest:
  nodeSelector:
    kubernetes.io/arch: arm64
  imagePullSecrets:
    - name: dockerregistry-ngc-secret
  ngcApiSecret:
    name: genericsecret-aiq-credentials
    create: false
  envVars:
    OCR_GRPC_ENDPOINT: nemotron-ocr-v1:8001
    OCR_HTTP_ENDPOINT: http://nemotron-ocr-v1:8000/v1/infer
    OCR_INFER_PROTOCOL: grpc
    OCR_MODEL_NAME: pipeline
    YOLOX_GRPC_ENDPOINT: nemotron-page-elements-v3:8001
    YOLOX_HTTP_ENDPOINT: http://nemotron-page-elements-v3:8000/v1/infer
    YOLOX_INFER_PROTOCOL: grpc
    YOLOX_GRAPHIC_ELEMENTS_GRPC_ENDPOINT: nemotron-graphic-elements-v1:8001
    YOLOX_GRAPHIC_ELEMENTS_HTTP_ENDPOINT: http://nemotron-graphic-elements-v1:8000/v1/infer
    YOLOX_GRAPHIC_ELEMENTS_INFER_PROTOCOL: grpc
    YOLOX_TABLE_STRUCTURE_GRPC_ENDPOINT: nemotron-table-structure-v1:8001
    YOLOX_TABLE_STRUCTURE_HTTP_ENDPOINT: http://nemotron-table-structure-v1:8000/v1/infer
    YOLOX_TABLE_STRUCTURE_INFER_PROTOCOL: grpc
  nimOperator:
    ocr:
      enabled: true
      authSecret: genericsecret-aiq-credentials
      nodeSelector:
        kubernetes.io/arch: arm64
      image:
        repository: nvcr.io/nim/nvidia/nemotron-ocr-v1
        tag: "1.3.0"
        pullSecrets:
          - dockerregistry-ngc-secret
      resources:
        limits:
          nvidia.com/gpu: 1
        requests:
          nvidia.com/gpu: 1
    page_elements:
      enabled: true
      authSecret: genericsecret-aiq-credentials
      nodeSelector:
        kubernetes.io/arch: arm64
      image:
        repository: nvcr.io/nim/nvidia/nemotron-page-elements-v3
        tag: "1.8.0"
        pullSecrets:
          - dockerregistry-ngc-secret
      resources:
        limits:
          nvidia.com/gpu: 1
        requests:
          nvidia.com/gpu: 1
    graphic_elements:
      enabled: true
      authSecret: genericsecret-aiq-credentials
      nodeSelector:
        kubernetes.io/arch: arm64
      image:
        repository: nvcr.io/nim/nvidia/nemotron-graphic-elements-v1
        tag: "1.8.0"
        pullSecrets:
          - dockerregistry-ngc-secret
      resources:
        limits:
          nvidia.com/gpu: 1
        requests:
          nvidia.com/gpu: 1
    table_structure:
      enabled: true
      authSecret: genericsecret-aiq-credentials
      nodeSelector:
        kubernetes.io/arch: arm64
      image:
        repository: nvcr.io/nim/nvidia/nemotron-table-structure-v1
        tag: "1.8.0"
        pullSecrets:
          - dockerregistry-ngc-secret
      resources:
        limits:
          nvidia.com/gpu: 1
        requests:
          nvidia.com/gpu: 1
